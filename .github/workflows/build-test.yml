name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Pinned to match Patches/notcurses/README.md -- bump both together, and
  # run Patches/notcurses/regenerate.sh if the patches themselves change.
  NOTCURSES_TAG: v3.0.17

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            preset: default
            binary_dir: build
            ctest_args: ""
          - name: sanitize
            preset: sanitize
            binary_dir: build-sanitize
            # [Performance] budgets are calibrated for an optimized NDEBUG
            # build; under ASan/UBSan plus a shared, contended runner they're
            # expected timing noise, not a correctness signal (see
            # ROADMAP.md's test-flakiness watch list) -- default already
            # covers this label, so exclude it here rather than let known
            # noise fail the job. Tests/CMakeLists.txt's TEST_SPEC-split
            # catch_discover_tests calls are what makes -LE Performance a
            # real CTest label instead of a hand-maintained name list.
            ctest_args: "-LE Performance"
    steps:
      - uses: actions/checkout@v4

      # Everything below is a system package/find_package/pkg-config lookup
      # (CMake/Dependencies.cmake) rather than FetchContent -- see that
      # file's own comments for why each one is resolved this way. Janet and
      # Notcurses are the two exceptions still built from source: Janet
      # isn't packaged for Ubuntu at all, and Notcurses needs an exact
      # pinned tag plus ned's own three input-handling patches (see
      # Patches/notcurses/README.md) that no distro's stock package carries.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libunistring-dev libdeflate-dev libncurses-dev \
            libcli11-dev libre2-dev libpcre2-dev libvterm-dev libutf8proc-dev nlohmann-json3-dev catch2 \
            libstdc++-14-dev

      # CMAKE_LINKER_TYPE (CMakePresets.json's "default" preset) needs CMake
      # >= 3.29; ubuntu-latest's preinstalled cmake isn't reliably that new.
      - name: Install a recent CMake
        run: pip install --upgrade "cmake>=3.29"

      # Janet is a system dependency (pkg_check_modules(Janet REQUIRED
      # janet) in CMakeLists.txt), not packaged for Ubuntu -- pinned to the
      # exact version this codebase's own documented Janet-build-specific
      # landmines (see Source/Janet/Value.h/Environment.h) were verified
      # against.
      - name: Build and install Janet
        run: |
          git clone --depth 1 --branch v1.32.1 https://github.com/janet-lang/janet.git /tmp/janet
          make -C /tmp/janet -j"$(nproc)"
          sudo make -C /tmp/janet install
          sudo ldconfig

      # Keyed on the pinned tag plus the patches themselves -- invalidates
      # automatically on either a version bump or a patch content change.
      - name: Cache built Notcurses
        id: notcurses-cache
        uses: actions/cache@v4
        with:
          path: /tmp/notcurses-install
          key: notcurses-${{ env.NOTCURSES_TAG }}-${{ hashFiles('Patches/notcurses/*.patch') }}

      # System Notcurses per CMake/Dependencies.cmake's own comment: exact
      # pinned tag (ABI-sensitive -- see that file's ncblitter_e note) with
      # the three fixes from Patches/notcurses/ applied via git am, built
      # with the same trim (no multimedia/doctest/pandoc/ffi extras) the
      # in-tree FetchContent build used to apply. Installed to a throwaway
      # prefix and copied into / (rather than a plain `make install`) so the
      # cache step above can capture exactly what got installed.
      - name: Build and install Notcurses
        if: steps.notcurses-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --branch "$NOTCURSES_TAG" --depth 50 https://github.com/dankamongmen/notcurses.git /tmp/notcurses
          cd /tmp/notcurses
          git config user.email ned-ci@localhost
          git config user.name "ned CI"
          for p in "$GITHUB_WORKSPACE"/Patches/notcurses/*.patch; do git am "$p"; done
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DUSE_MULTIMEDIA=none -DUSE_DOCTEST=OFF -DUSE_PANDOC=OFF -DUSE_DOXYGEN=OFF \
            -DBUILD_EXECUTABLES=OFF -DBUILD_FFI_LIBRARY=OFF -DUSE_POC=OFF -DUSE_QRCODEGEN=OFF \
            -DUSE_STATIC=OFF
          cmake --build build -j"$(nproc)"
          DESTDIR=/tmp/notcurses-install cmake --install build
      - name: Install cached/built Notcurses
        run: |
          sudo cp -a /tmp/notcurses-install/usr/local/. /usr/local/
          sudo ldconfig

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build ${{ matrix.binary_dir }} -j"$(nproc)"

      # $TERM is unset on the runner (no controlling terminal at all), and
      # notcurses_core_init (Source/UI/EventLoop.cpp) hard-fails without a
      # resolvable terminfo entry -- every test that constructs a real
      # ui::EventLoop (BufferViewTest.cpp and friends) throws "EventLoop:
      # notcurses_core_init failed" as a result. Confirmed live: unsetting
      # TERM locally reproduces the exact failure, and setting it (even with
      # no real pty at all, stdin/stdout fully redirected) is sufficient to
      # fix it -- notcurses only needs a valid terminfo lookup at init, not
      # an actual interactive terminal device.
      - name: Test
        run: ctest --test-dir ${{ matrix.binary_dir }} --output-on-failure ${{ matrix.ctest_args }}
        env:
          TERM: xterm-256color
