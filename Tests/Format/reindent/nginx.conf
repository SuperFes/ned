events {
    worker_connections 1024;
}

http {
    upstream app {
        server 127.0.0.1:8080 weight=5;
        server 10.0.0.2;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
    }

    server {
        listen 80;
        allow 10.0.0.0/8;
        location / {
            proxy_pass http://app;
            limit_except GET {
                deny all;
            }
            if ($request_method = POST) {
                return 405;
            }
        }
    }
}
