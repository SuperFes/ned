<VirtualHost *:80>
    ServerName example.com
    <Directory /srv>
        Require all granted
    </Directory>
    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>
</VirtualHost>

# Top-level directives stay at column zero.
Listen 80
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        SSLEngine on
        <Location "/admin">
            Require ip 10.0.0.0/8
        </Location>
    </VirtualHost>
</IfModule>
